site_name: zip-forensic
site_url: https://securityronin.github.io/zip-forensic/
repo_url: https://github.com/SecurityRonin/zip-forensic
repo_name: SecurityRonin/zip-forensic
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Validation: validation.md
  - Fleet migration: migration.md
  - Decisions:
      - Overview: decisions/index.md
      - 0001 Pure-Rust, no C-FFI: decisions/0001-pure-rust-zip-reader-no-c-ffi.md
      - 0002 Read/decrypt-only: decisions/0002-read-decrypt-only-recognize-and-refuse.md
      - 0003 Tiered validation: decisions/0003-tiered-validation-real-corpora.md
  - Privacy Policy: privacy.md
  - Terms of Service: terms.md

plugins:
  - search
