[package]
name = "zip-forensic-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Albert Hui <albert@securityronin.com>"]
description = "zip4n6: command-line ZIP forensic auditor and entry lister over zip-core / zip-forensic."
# Debug/standalone CLI — the fleet end-user CLI is issen/disk4n6. Not published.
publish = false

[[bin]]
name = "zip4n6"
path = "src/main.rs"

[dependencies]
zip-forensic-core = { workspace = true }
zip-forensic = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
