[package]
name = "zip-forensic-core"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Albert Hui <albert@securityronin.com>"]
description = "Pure-Rust, no-C-FFI ZIP reader for forensics: decodes Stored, Deflate, Deflate64, Bzip2, Zstd, LZMA and XZ, decrypts ZipCrypto + WinZip AES, with deflate-block random access into E01-in-zip."
readme = "../README.md"
keywords = ["zip", "deflate64", "zstd", "decrypt", "forensics"]
categories = ["compression", "filesystem", "parser-implementations"]

[lib]
name = "zip_core"

[features]
default = []
# Adapt `ZipArchive` to the forensic-vfs `FileSystem` trait (see `src/vfs.rs`) so
# a ZIP archive's file tree composes as `Arc<dyn FileSystem>` in the forensic-vfs
# engine, like the AD1 / DAR adapters.
vfs = ["dep:forensic-vfs"]

[dependencies]
# Pure-Rust DEFLATE (miniz_oxide backend). The default zlib/zlib-ng backend pulls
# C, so the rust_backend feature is mandatory for the no-*-sys goal.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
thiserror = "2"
# Pure-Rust, decompress-only codecs (NO *-sys). Versions verified to resolve.
# method 9 — Deflate64 (pure Rust; zip-rs uses the same). The `checkpoint` feature
# provides mid-stream decoder state save/restore, backing block-indexed seek.
deflate64 = { version = "0.1", features = ["checkpoint"] }
bzip2-rs = "0.1"         # method 12 — bzip2 decompress-only, pure Rust
ruzstd = "0.8"           # method 93 — Zstandard decoder, pure Rust
lzma-rs = "0.3"          # methods 14/95 — LZMA (ZIP wrapper) + XZ, pure Rust
# Decryption. ZipCrypto is the ZIP format's own legacy cipher (implemented here);
# WinZip AES uses audited RustCrypto primitives — NEVER hand-rolled (CLAUDE.md).
aes = "0.8"
ctr = "0.9"
cbc = "0.1"              # AES-CBC for PKWARE strong encryption (RustCrypto)
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
constant_time_eq = "0.3"
# forensic-vfs (KNOWLEDGE leaf) — the read-only FileSystem navigation contract.
# Optional so the bare reader stays dependency-light; the `vfs` feature turns on
# the adapter (src/vfs.rs), mirroring the AD1 / DAR crates.
forensic-vfs = { version = "0.1", optional = true }

# zip-rs (zip) is retained ONLY as a tier-1 differential ORACLE for tests. It is
# NOT a normal dependency, so it does not enter zip-core's runtime tree:
# `cargo tree -p zip-core -e normal` is free of *-sys. This is the milestone that
# removes the three C-FFI libs (bzip2-sys/zstd-sys/lzma-sys) from the fleet build.
[dev-dependencies]
zip = "2"
tempfile = "3"

[lints]
workspace = true
